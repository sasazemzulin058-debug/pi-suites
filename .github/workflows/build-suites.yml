name: Build & Release Pi Suites
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write

env:
  ANDROID_NDK_VERSION: r26d

jobs:
  ast-grep:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            target: x86_64-unknown-linux-gnu
            linker: ''
          - name: android-arm64
            target: aarch64-linux-android
            linker: aarch64-linux-android24-clang
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        run: rustup target add ${{ matrix.target }}
      - if: matrix.name == 'android-arm64'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}
      - run: git clone --depth 1 https://github.com/ast-grep/ast-grep.git vendor-ast-grep
      - name: Build
        shell: bash
        run: |
          cd vendor-ast-grep
          if [ '${{ matrix.name }}' = android-arm64 ]; then
            export NDK="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
            export PATH="$NDK:$PATH"
            ln -sf "$NDK/aarch64-linux-android24-clang" "$NDK/aarch64-linux-android-clang"
            mkdir -p .cargo
            printf '[target.aarch64-linux-android]\nlinker = "%s/%s"\nar = "%s/llvm-ar"\n' "$NDK" '${{ matrix.linker }}' "$NDK" > .cargo/config.toml
          fi
          cargo build --release --bin ast-grep --target '${{ matrix.target }}'
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp target/'${{ matrix.target }}'/release/ast-grep "$GITHUB_WORKSPACE/out/ast-grep-${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-ast-grep-${{ matrix.name }}
          path: out/ast-grep-${{ matrix.name }}

  readseek:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            target: x86_64-unknown-linux-gnu
          - name: android-arm64
            target: aarch64-linux-android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        run: rustup target add ${{ matrix.target }}
      - if: matrix.name == 'android-arm64'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}
      - run: git clone --depth 1 https://github.com/jarkkojs/readseek.git vendor-readseek
      - name: Apply Android patch and build
        shell: bash
        run: |
          cd vendor-readseek
          git apply --check ../patches/readseek-client.patch
          git apply ../patches/readseek-client.patch
          if [ '${{ matrix.name }}' = android-arm64 ]; then
            export NDK="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
            export PATH="$NDK:$PATH"
            ln -sf "$NDK/aarch64-linux-android24-clang" "$NDK/aarch64-linux-android-clang"
            mkdir -p .cargo
            printf '[target.aarch64-linux-android]\nlinker = "%s/aarch64-linux-android24-clang"\nar = "%s/llvm-ar"\n' "$NDK" "$NDK" > .cargo/config.toml
          fi
          cargo build --release --bin readseek --target '${{ matrix.target }}'
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp target/'${{ matrix.target }}'/release/readseek "$GITHUB_WORKSPACE/out/readseek-${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-readseek-${{ matrix.name }}
          path: out/readseek-${{ matrix.name }}

  fff:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        run: rustup target add aarch64-linux-android
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}
      - run: git clone --depth 1 https://github.com/dmtrKovalenko/fff.nvim.git vendor-fff
      - name: Build
        shell: bash
        run: |
          cd vendor-fff
          git apply ../patches/fff.patch
          export NDK="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$NDK:$PATH"
          ln -sf "$NDK/aarch64-linux-android24-clang" "$NDK/aarch64-linux-android-clang"
          mkdir -p .cargo
          printf '[target.aarch64-linux-android]\nlinker = "%s/aarch64-linux-android24-clang"\nar = "%s/llvm-ar"\n' "$NDK" "$NDK" > .cargo/config.toml
          cargo build --release -p fff-c --target aarch64-linux-android
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp target/aarch64-linux-android/release/libfff_c.so "$GITHUB_WORKSPACE/out/libfff_c.so"
      - uses: actions/upload-artifact@v4
        with:
          name: native-fff-android
          path: vendor-fff/"$GITHUB_WORKSPACE/out/libfff_c.so"

  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g esbuild
      - name: Clone JS upstreams and apply patches
        shell: bash
        run: |
          mkdir -p vendor
          git clone --depth 1 https://github.com/apmantza/pi-lens.git vendor/pi-lens
          git clone --depth 1 https://github.com/gjczone/pi-shazam.git vendor/pi-shazam
          git clone --depth 1 https://github.com/jarkkojs/readseek.git vendor/readseek
          git clone --depth 1 https://github.com/weichenw/pi-hermes-memory.git vendor/pi-hermes-memory
          git clone --depth 1 https://github.com/nicobailon/pi-web-access.git vendor/pi-web-access || true
          (cd vendor/pi-shazam && git apply ../../patches/pi-shazam.patch)
          (cd vendor/pi-hermes-memory && git apply ../../patches/pi-hermes-memory.patch)
          for d in vendor/pi-lens vendor/pi-shazam vendor/pi-hermes-memory vendor/pi-web-access; do
            if [ -d "$d" ]; then
              (cd "$d" && rm -f package-lock.json npm-shrinkwrap.json && node -e '
                const fs = require("fs");
                const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
                for (const field of ["dependencies", "devDependencies", "optionalDependencies", "peerDependencies"]) {
                  if (p[field]) for (const name of Object.keys(p[field])) if (name.startsWith("@earendil-works/")) delete p[field][name];
                }
                fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");
              ' && npm install --ignore-scripts --legacy-peer-deps --no-package-lock && npm run build --if-present)
            fi
          done
          # readseek CLI is built by the separate Rust job; only its Pi package is installed here.
          (cd vendor/readseek/packages/pi-readseek && npm install --ignore-scripts --legacy-peer-deps --no-package-lock && npm run build --if-present)
      - name: Bundle suites
        shell: bash
        run: |
          set +e
          mkdir -p suites/pi-search-suite/dist suites/pi-memory-suite/dist suites/pi-execution-suite/dist
          ext='--external:node:* --external:@earendil-works/* --external:typebox --external:better-sqlite3'
          esbuild vendor/pi-lens/dist/index.js --bundle --platform=node --format=cjs --outfile=suites/pi-search-suite/dist/pi-lens.js $ext
          esbuild vendor/pi-shazam/dist/index.js --bundle --platform=node --format=cjs --outfile=suites/pi-search-suite/dist/pi-shazam.js $ext
          esbuild vendor/readseek/packages/pi-readseek/dist/index.js --bundle --platform=node --format=cjs --outfile=suites/pi-search-suite/dist/pi-readseek.js $ext
          esbuild vendor/pi-hermes-memory/src/index.ts --bundle --platform=node --format=cjs --outfile=suites/pi-memory-suite/dist/pi-hermes-memory.js $ext
          cp suites/.suite-entries/pi-search-suite.js suites/pi-search-suite/dist/index.js
          cp suites/.suite-entries/pi-memory-suite.js suites/pi-memory-suite/dist/index.js
          cp suites/.suite-entries/pi-execution-suite.js suites/pi-execution-suite/dist/index.js
          (cd suites/pi-search-suite && npm pack --pack-destination ../../artifacts)
          (cd suites/pi-memory-suite && npm pack --pack-destination ../../artifacts)
          (cd suites/pi-execution-suite && npm pack --pack-destination ../../artifacts)
      - uses: actions/upload-artifact@v4
        with:
          name: suite-packages
          path: artifacts/*.tgz

  release:
    needs: [ast-grep, readseek, fff, suites]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '*'
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly monorepo build
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
