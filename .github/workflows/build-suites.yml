name: Build & Release Unified Pi Suites (Android ARM64)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4

      - name: Clone upstream sources
        run: |
          mkdir -p vendor
          # Search suite
          git clone --depth 1 https://github.com/gjczone/pi-shazam.git           vendor/pi-shazam
          git clone --depth 1 https://github.com/jarkkojs/readseek.git            vendor/readseek
          git clone --depth 1 https://github.com/nicobailon/pi-web-access.git     vendor/pi-web-access || true
          # Memory suite
          git clone --depth 1 https://github.com/weichenw/pi-hermes-memory.git   vendor/pi-hermes-memory
          git clone --depth 1 https://github.com/mksglu/context-mode.git         vendor/context-mode
          # Execution suite
          git clone --depth 1 https://github.com/quintinshaw/pi-dynamic-workflows.git vendor/pi-dynamic-workflows || true
          git clone --depth 1 https://github.com/nicobailon/pi-subagents.git      vendor/pi-subagents || true
          git clone --depth 1 https://github.com/aliou/pi-processes.git           vendor/pi-processes || true
          git clone --depth 1 https://github.com/tintinweb/pi-schedule-prompt.git vendor/pi-schedule-prompt || true
          git clone --depth 1 https://github.com/sebaxzero/pi-loop-police.git     vendor/pi-loop-police || true
          # Shared: pix-mono + fff-node
          git clone --depth 1 https://github.com/xynogen/pix-mono.git             vendor/pix-mono
          git clone --depth 1 https://github.com/dmtrKovalenko/fff.nvim.git       vendor/fff

      - name: Apply Android/Termux patches
        run: |
          cd vendor/pi-shazam       && git apply ../../patches/pi-shazam.patch       && cd ../..
          cd vendor/pi-hermes-memory && git apply ../../patches/pi-hermes-memory.patch && cd ../..
          cd vendor/context-mode    && git apply ../../patches/context-mode.patch     && cd ../..
          cd vendor/pix-mono        && git apply ../../patches/pix-mono.patch         && cd ../..
          cd vendor/fff             && git apply ../../patches/fff.patch              && cd ../..

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install vendor npm deps
        run: |
          cd vendor/pi-shazam && npm install --ignore-scripts --legacy-peer-deps || true; cd ../..
          cd vendor/readseek  && npm install --ignore-scripts --legacy-peer-deps || true; cd ../..
          cd vendor/pi-hermes-memory && npm install --ignore-scripts --legacy-peer-deps || true; cd ../..
          cd vendor/context-mode     && npm install --ignore-scripts --legacy-peer-deps || true; cd ../..
          cd vendor/pix-mono && npm install --ignore-scripts --legacy-peer-deps || true; cd ../..

      - name: Install esbuild
        run: npm install -g esbuild

      - name: Build pi-search-suite
        run: |
          cd suites/pi-search-suite
          cat src/index.ts
          npx esbuild src/index.ts \
            --bundle --platform=node --target=node24 --format=cjs \
            --outfile=dist/pi-search-suite.js \
            --external:@ast-grep/napi \
            --external:@ff-labs/fff-node \
            --external:@earendil-works/* \
            --external:tree-sitter* \
            --external:node:* \
            --external:better-sqlite3 \
            --external:@sinclair/typebox || true

      - name: Build pi-memory-suite
        run: |
          cd suites/pi-memory-suite
          npx esbuild src/index.ts \
            --bundle --platform=node --target=node24 --format=cjs \
            --outfile=dist/pi-memory-suite.js \
            --external:@earendil-works/* \
            --external:node:* \
            --external:better-sqlite3 || true

      - name: Build pi-execution-suite
        run: |
          cd suites/pi-execution-suite
          npx esbuild src/index.ts \
            --bundle --platform=node --target=node24 --format=cjs \
            --outfile=dist/pi-execution-suite.js \
            --external:@earendil-works/* \
            --external:node:* || true

      - name: Create Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Nightly Precompiled Suites"
          files: |
            suites/pi-search-suite/dist/pi-search-suite.js
            suites/pi-memory-suite/dist/pi-memory-suite.js
            suites/pi-execution-suite/dist/pi-execution-suite.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
