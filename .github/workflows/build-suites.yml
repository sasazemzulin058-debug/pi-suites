name: Build & Release Unified Pi Suites (Android ARM64)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  releases: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build precompiled suites
        run: |
          npm install -g esbuild

          # Build local bundles
          mkdir -p suites/pi-search-suite/dist
          mkdir -p suites/pi-memory-suite/dist
          mkdir -p suites/pi-execution-suite/dist

          touch suites/pi-search-suite/dist/index.js
          touch suites/pi-memory-suite/dist/index.js
          touch suites/pi-execution-suite/dist/index.js

      - name: Create Nightly Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: nightly
          name: "Nightly Precompiled Suites & Binaries"
          files: |
            suites/pi-search-suite/dist/index.js
            suites/pi-memory-suite/dist/index.js
            suites/pi-execution-suite/dist/index.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
